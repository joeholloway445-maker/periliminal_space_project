<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hyperliminal Cabinet</title>
  <style>
    body { font-family: sans-serif; background:#140814; color:#f3d9ff; padding:32px; }
    button { font-size:18px; padding:10px 16px; }
    #out { margin-top:16px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Cabinet</h1>
  <p>Spin happens here. Godot only spent chips when it opened the ticket.</p>
  <label>Wager <input id="wager" type="number" value="5" min="1" /></label>
  <button id="spin">Spin</button>
  <pre id="out"></pre>
  <script>
    const params = new URLSearchParams(location.search);
    const player = params.get("ticket") || "anon";
    document.getElementById("spin").onclick = async () => {
      const wager = Number(document.getElementById("wager").value || 5);
      const won = Math.random() < 0.42;
      const res = await fetch("/api/casino/settle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player_id: player, wager, won, mult: 2, ticket_id: params.get("tid") || "" })
      });
      const json = await res.json();
      document.getElementById("out").textContent = JSON.stringify(json, null, 2);
    };
  </script>
</body>
</html>
